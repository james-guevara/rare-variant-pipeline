[project]
name = "standalone-loftee"
version = "0.1.0"
description = "A version-locked standalone reimplementation of LOFTEE classification"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "numpy>=2.0,<3",
    "pyarrow>=24,<25",
    "pybigwig>=0.3.24,<0.4",
    "pysam>=0.23.3,<0.24",
    "zarr>=3.3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standalone_loftee"]
